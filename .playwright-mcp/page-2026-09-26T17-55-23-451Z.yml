                    - cell "$35" [ref=f7e169]
            - paragraph [ref=f7e170]:
              - text: You can view your total monetized messages and total earnings accumulated per-bot on the
              - link "Creators page" [ref=f7e171] [cursor=pointer]:
                - /url: https://poe.com/creators
              - text: on Poe.com’s desktop website. These message counts or total earnings may be adjusted in accordance with the
              - link "Terms of Service" [ref=f7e172] [cursor=pointer]:
                - /url: https://poe.com/earnings_tos
              - text: (e.g. policy violating behaviors).
            - heading [level=2] [ref=f7e173]:
              - link "How should I decide on a price?" [ref=f7e174] [cursor=pointer]:
                - /url: "#h_01HTQ3YX8B3ZTDEY852NGTWX83"
            - paragraph [ref=f7e175]: The cost to users will be displayed in compute points which are an aggregate of the price you set and our costs (e.g. base bots, compute costs, etc). So balance is important. We recommend starting with lower prices and making infrequent adjustments. If you have your own server costs, set a price that covers those costs. Higher prices and frequent price changes could affect your distribution on Poe and result in fewer users messaging your bot.
            - paragraph [ref=f7e176]: The system will allow you to change the per-message price as often as you would like and view the current user-facing points price from your bot’s edit page. It may take up to 24 hours for a price to update. The maximum price per 1,000 messages is 10,000 USD, meant to cover API bots that are expensive to run or contain highly specialized knowledge bases. On Poe, prices and earnings are in United States Dollars (USD).
            - heading [level=2] [ref=f7e177]:
              - link "How do I receive payments?" [ref=f7e178] [cursor=pointer]:
                - /url: "#h_01HSYP0PT2G337ZD6WBE4W407B"
            - paragraph [ref=f7e179]: Complete your account setup on Stripe to receive payouts. After joining creator monetization, navigate to the Creators page and follow the instructions to connect to our payment processor. Fill in your taxpayer information within 90 days of joining the program to be eligible for payments. You will receive payments through your Stripe account. Poe will send payments in USD to Stripe, and Stripe will transfer payments to you. If needed, Stripe will convert to the currency set in your Stripe account based on their available conversion rate at that time.
            - heading [level=2] [ref=f7e180]:
              - link "When will I receive payments?" [ref=f7e181] [cursor=pointer]:
                - /url: "#h_01HSYP2920PNGYA8YV6109YEA6"
            - paragraph [ref=f7e182]:
              - text: Assuming you are eligible, have joined creator monetization, completed all required information, and remain in good standing, you will become eligible for a payment when you have earnings of $10+ to be paid. Payments are made within 30–45 days of the end of a month. For example, if your bot has earnings January 1st and January 28th, the end of the month is January 31st; 30-45 days later- February 28th to March 15th- you would be paid those earnings. See the
              - link "terms and conditions" [ref=f7e183] [cursor=pointer]:
                - /url: https://poe.com/earnings_tos
              - text: for full details.
            - heading [level=2] [ref=f7e184]:
              - link "How do I set a price for my bot?" [ref=f7e185] [cursor=pointer]:
                - /url: "#h_01HTQ4C0MSQFWBWCR5NG5PVW1V"
            - paragraph [ref=f7e186]: You can set a bot’s price when you create or edit one of your bots.
            - paragraph [ref=f7e187]: "New bot price setting:"
            - list [ref=f7e188]:
              - listitem [ref=f7e189]: Visit poe.com or the Poe app.
              - listitem [ref=f7e190]: Click "Create bot" in the menu.
              - listitem [ref=f7e191]: Scroll down to Monetization tools.
              - listitem [ref=f7e192]: Customize your bot's price.
            - paragraph [ref=f7e193]: "Existing bot price setting:"
            - list [ref=f7e194]:
              - listitem [ref=f7e195]: Visit poe.com or the Poe app.
              - listitem [ref=f7e196]:
                - text: Navigate to your
                - link "profile" [ref=f7e197] [cursor=pointer]:
                  - /url: https://poe.com/profile
                - text: to view your bot list.
              - listitem [ref=f7e198]: Click on the bot you wish to edit. This will open a chat page with that bot.
              - listitem [ref=f7e199]: In the bot details on the right of the page, or on the bot info card at the top of the chat thread, click the overflow button (ie “...”).
              - listitem [ref=f7e200]: Click "Edit bot".
              - listitem [ref=f7e201]: Scroll down to Monetization tools.
              - listitem [ref=f7e202]: Customize your bot's price.
