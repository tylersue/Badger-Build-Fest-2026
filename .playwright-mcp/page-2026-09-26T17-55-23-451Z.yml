          - generic [ref=f7e40]:
            - heading [level=2] [ref=f7e41]:
              - link "What is creator monetization?" [ref=f7e42] [cursor=pointer]:
                - /url: "#h_01HSYNAVFYE29TNWV8TR10ZDYT"
            - paragraph [ref=f7e43]:
              - text: The creator monetization program pays Poe bot creators for engaging users with their bots. You can set a price per message sent to your bots. For developers, see the
              - link "API documentation" [ref=f7e44] [cursor=pointer]:
                - /url: https://creator.poe.com/docs/server-bots/poe-bot-monetization-api-documentation
              - text: for monetizing based on your specific bot implementation.
            - heading [level=2] [ref=f7e45]:
              - link "How do I participate in creator monetization?" [ref=f7e46] [cursor=pointer]:
                - /url: "#h_01HSYNE5WBB742TJ5M9BS4SG41"
            - heading "Join the program" [level=3] [ref=f7e47]
            - paragraph [ref=f7e48]:
              - text: Visit
              - link "poe.com/creators" [ref=f7e49] [cursor=pointer]:
                - /url: https://poe.com/creators
              - text: via a desktop web browser, or navigate to Creators in the Poe menu. Navigate to Creators in the menu. Follow the steps to join creator monetization.
            - heading "Set your price" [level=3] [ref=f7e50]
            - paragraph [ref=f7e51]: You can set a bot’s price per-message. Each time a user messages your bot, you earn that price from Poe. Choose a price that balances your earnings with user accessibility - lower prices attract more users, while higher prices could limit your bot’s use, as it turns away some users.
            - heading "Share" [level=3] [ref=f7e52]
            - paragraph [ref=f7e53]: Share your bots with your friends, on social media, or use any other marketing approach to help people discover them. The more users engage with your bots, the more you’ll be able to earn.
            - heading "Get paid" [level=3] [ref=f7e54]
            - paragraph [ref=f7e55]: "Earn money when:"
            - list [ref=f7e56]:
              - listitem [ref=f7e57]: users send messages to your bot
            - paragraph [ref=f7e58]: Check the Creator page to see earnings per bot.
            - heading [level=2] [ref=f7e59]:
              - link "Who is eligible to be monetized?" [ref=f7e60] [cursor=pointer]:
                - /url: "#h_01HSYNR7XFRXTQT1T4GKPKY8DZ"
            - paragraph [ref=f7e61]:
              - text: Bot creators must agree to the Poe Creator Monetization program
              - link "terms and conditions" [ref=f7e62] [cursor=pointer]:
                - /url: https://poe.com/earnings_tos
              - text: "and must be based in an eligible region to set a price per message. Below are the regions where the Poe Creator Monetization program is currently available:"
