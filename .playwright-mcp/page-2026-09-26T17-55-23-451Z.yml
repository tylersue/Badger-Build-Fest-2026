            - heading [level=2] [ref=f7e142]:
              - link "How are message earnings calculated?" [ref=f7e143] [cursor=pointer]:
                - /url: "#h_01HSYNSSMCQSRMJ3MF9S1EQMHT"
            - paragraph [ref=f7e144]: For every message sent to you that your bot responds to, you earn the price you set. Total message earnings are the sum of all those creator prices earned during a pay period.
            - paragraph [ref=f7e145]: "For example, the below table illustrates how changes to your per-message price can affect your earnings. For the full month, total earnings from messages would be $65:"
            - figure [ref=f7e146]:
              - table [ref=f7e147]:
                - rowgroup [ref=f7e148]:
                  - row [ref=f7e149]:
                    - columnheader "Day" [ref=f7e150]
                    - columnheader "Creator price in USD$ per 1000 messages" [ref=f7e151]: Creator price in USD$per 1000 messages
                    - columnheader "Total messages responded to (in 1000s)" [ref=f7e152]: Total messages responded to(in 1000s)
                    - columnheader "Total messages responded to (in 1000s)" [ref=f7e153]: Total messages responded to(in 1000s)
